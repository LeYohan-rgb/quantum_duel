<body>
  <div id="player1"></div>
  <div id="player2"></div>
  <div id="bullets"></div>
  <div id="bullets2"></div>
  <div id="wall"></div>
    <h2 id ="health1">Health: 10</h2><h2 id="health2">Health: 10</h2>
<h1 id ="winning_label"></h1>

  <style>
    body { background: black; color: white; font-family: sans-serif; }

    #winning_label {
    position: fixed;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    font-size: 50px;
    }

    #health1 {
        position: fixed;
        left: 10px;
        top: 10px;
    }
    #health2 {
        position: fixed;
        right: 10px;
        top: 10px;
    }

    #wall {
        width: 25px;
        height: 100%;
        background: grey;
        position: absolute;
    }

    #player1 {
        width : 50px;
        height: 50px;
        background: red;
        position: absolute;
        
    }

    #player2 {
        width: 50px;
        height: 50px;
        background: blue;
        position: absolute;
    }

    .bullet {
        width: 25px;
        height: 25px;
        background: rgb(253, 255, 193);
        position: absolute;
    }
  </style>
  <script>
    const win_lbl = document.getElementById("winning_label");
    const window_height = window.innerHeight;
    const window_width = window.innerWidth;
    const bullets = document.getElementById("bullets");
    const bullets_2 = document.getElementById("bullets2");
    const health_1 = document.getElementById("health1");
    const health_2 = document.getElementById("health2");
    let health1=10;
    let health2=10;


    const wall = document.getElementById("wall");
    wall.style.left = (window_width - 50)/2 + 'px';


    const plr1 = document.getElementById("player1");
    let x = 100;
    let y = 100;
    let paused = false;
    const speed = 15;
    const keys = {};
    const keys_2 = {};

    document.addEventListener("keydown", function(event) {
        event.preventDefault();

        const key = event.key.toLowerCase();

        keys[key] = true;
        keys_2[key] = true;


        if (key == 'e' && !event.repeat) {
            shootBullet(1);
        }
        if (event.code == 'ControlRight' && !event.repeat) {
            shootBullet(2);
        }
    })

    document.addEventListener("keyup", function(event) {
        event.preventDefault();

        const key = event.key.toLowerCase();

        keys[key] = false;
        keys_2[key] = false;
    })


    function bulletHit(player) {
        if (player == 1) {
            health2 -= 1;
            health_2.textContent = `Health: ${health2}`;
            if (health2 <= 0) {
                paused = true;
                win_lbl.textContent = "RED WON!"
            }
        }
        else {
            health1 -= 1;
            health_1.textContent = `Health: ${health1}`;
            if (health1 <= 0) {
                paused = true;
                win_lbl.textContent = "BLUE WON!"
            }
        }
    }

    function shootBullet(player) {
        let bullet = document.createElement("div");
        bullet.classList.add("bullet");

        if (player == 1) {
            bullet.style.left = x + 50 + "px";
            bullet.style.top = y + 10 + "px";
            bullets.appendChild(bullet);
        }
        else {
            bullet.style.left = x_2 - 50 + "px";
            bullet.style.top = y_2 + 10 + "px";
            bullets_2.appendChild(bullet);
        }
    }

    function gameLoop() {
        if (paused) {
            return;
        }

        let dx = 0;
        let dy = 0;

        if (keys['w']) {
            dy -= 1;
        }
        if (keys['s']) {
            dy += 1;
        }
        if (keys['a']) {
            dx -= 1;
        }
        if (keys['d']) {
            dx += 1;
        }

        const length = Math.hypot(dx, dy);

        if (length) {
            dx /= length;
            dy /= length;
        }

        x += dx * speed;
        y += dy * speed;

        x = Math.min(x, (window_width-50)/2 - 50);
        y = Math.min(y, window_height - 50);

        x = Math.max(0, x);
        y = Math.max(0, y);


        plr1.style.left = x + 'px';
        plr1.style.top = y + 'px';


        for (let bullet of bullets.children) {
            let bullet_x = parseInt(bullet.style.left) + 60;
            bullet.style.left = bullet_x + "px";


            let bulletRect = bullet.getBoundingClientRect();
            let plr_2_rect = plr2.getBoundingClientRect();

            if (
                bulletRect.left < plr_2_rect.right &&
                bulletRect.right > plr_2_rect.left &&
                bulletRect.top < plr_2_rect.bottom &&
                bulletRect.bottom > plr_2_rect.top
            ) {
                bullet.remove();
                bulletHit(1);
            }

            if (bullet_x > window_width) {
                bullet.remove();
            }
        }

        requestAnimationFrame(gameLoop);
    }

    const plr2 = document.getElementById("player2");
    let x_2 = 1800;
    let y_2 = 800;
    const speed_2 = 15;


    function gameLoop2() {
        if (paused) {
            return;
        }

        let dx_2 = 0;
        let dy_2 = 0;

        if (keys_2['arrowup']) {
            dy_2 -= 1;
        }
        if (keys_2['arrowdown']) {
            dy_2 += 1;
        }
        if (keys_2['arrowleft']) {
            dx_2 -= 1;
        }
        if (keys_2['arrowright']) {
            dx_2 += 1;
        }

  
        x_2 = Math.min(x_2, window_width - 50);
        y_2 = Math.min(y_2, window_height - 50);

        x_2 = Math.max((window_width - 50)/2 + 50, x_2);
        y_2 = Math.max(0, y_2);

        const length_2 = Math.hypot(dx_2, dy_2);

        if (length_2) {
            dx_2 /= length_2;
            dy_2 /= length_2;
        }

        x_2 += dx_2 * speed_2;
        y_2 += dy_2 * speed_2;

        plr2.style.left = x_2 + 'px';
        plr2.style.top = y_2 + 'px';


        for (let bullet of bullets_2.children) {
            let bullet_x = parseInt(bullet.style.left) - 60;
            bullet.style.left = bullet_x + "px";


            let bulletRect = bullet.getBoundingClientRect();
            let plr_1_rect = plr1.getBoundingClientRect();

            if (
                bulletRect.left < plr_1_rect.right &&
                bulletRect.right > plr_1_rect.left &&
                bulletRect.top < plr_1_rect.bottom &&
                bulletRect.bottom > plr_1_rect.top
            ) {
                bullet.remove();
                bulletHit(2);
            }


            if (bullet_x < 0) {
                bullet.remove();
            }
        }

        requestAnimationFrame(gameLoop2);
    }

    gameLoop();
    gameLoop2();
  </script>
