<body>
  <div id="player1"></div>
  <div id="player2"></div>
  <div id="bullets"></div>
  <div id="bullets2"></div>
  <style>
    body { background: black; color: white; font-family: sans-serif; }

    #player1 {
        width : 50px;
        height: 50px;
        background: red;
        position: absolute;
        
    }

    #player2 {
        width: 50px;
        height: 50px;
        background: blue;
        position: absolute;
    }

    .bullet {
        width: 25px;
        height: 25px;
        background: white;
        position: absolute;
    }
  </style>
  <script>
    const window_height = window.innerHeight;
    const window_width = window.innerWidth;
    const bullets = document.getElementById("bullets");
    const bullets_2 = document.getElementById("bullets2");

    const plr1 = document.getElementById("player1");
    let x = 100;
    let y = 100;
    const speed = 15;
    const keys = {};

    document.addEventListener("keydown", function(event) {
        keys[event.key.toLowerCase()] = true;

        if (event.key.toLowerCase() == 'e') {
            shootBullet(1);
        }
        if (event.code == 'ShiftRight') {
            shootBullet(2);
        }
    })

    document.addEventListener("keyup", function(event) {
        keys[event.key.toLowerCase()] = false;
    })

    // let's create the bullet

    function shootBullet(player) {
        let bullet = document.createElement("div");
        bullet.classList.add("bullet");

        if (player == 1) {
            bullet.style.left = x + 50 + "px";
            bullet.style.top = y + 10 + "px";
            bullets.appendChild(bullet);
        }
        if (player == 2) {
            bullet.style.left = x_2 - 50 + "px";
            bullet.style.top = y_2 + 10 + "px";
            bullets_2.appendChild(bullet);
        }
    }

    function gameLoop() {
        let dx = 0;
        let dy = 0;

        if (keys['w']) {
            dy -= 1;
        }
        if (keys['s']) {
            dy += 1;
        }
        if (keys['a']) {
            dx -= 1;
        }
        if (keys['d']) {
            dx += 1;
        }


        // dont let diagonals go faster
        const length = Math.hypot(dx, dy);

        if (length > 0) {
            dx /= length;
            dy /= length;
        }

        x += dx * speed;
        y += dy * speed;

        //AVOID PLAYER FROM GOING OFF BOUNDS
        x = Math.min(x, (window_width-50)/2 - 50);
        y = Math.min(y, window_height - 50);

        x = Math.max(0, x);
        y = Math.max(0, y);


        plr1.style.left = x + 'px';
        plr1.style.top = y + 'px';


        //moving the bullets
        for (let bullet of bullets.children) {
            let bullet_x = parseInt(bullet.style.left) + 60;
            bullet.style.left = bullet_x + "px";

            //check collision!
            let bulletRect = bullet.getBoundingClientRect();
            let plr_2_rect = plr2.getBoundingClientRect();

            if (
                bulletRect.left < plr_2_rect.right &&
                bulletRect.right > plr_2_rect.left &&
                bulletRect.top < plr_2_rect.bottom &&
                bulletRect.bottom > plr_2_rect.top
            ) {
                bullet.remove();
            }

            //BULLET WENT OFF BOUNDS
            if (bullet_x > window_width) {
                bullet.remove();
            }
        }

        requestAnimationFrame(gameLoop);
    }

    const plr2 = document.getElementById("player2");
    let x_2 = 1800;
    let y_2 = 800;
    const speed_2 = 15;
    const keys_2 = {};

    document.addEventListener("keydown", function(event) {
        keys_2[event.key.toLowerCase()] = true;
    })

    document.addEventListener("keyup", function(event) {
        keys_2[event.key.toLowerCase()] = false;
    })

    function gameLoop2() {
        let dx_2 = 0;
        let dy_2 = 0;

        if (keys_2['arrowup']) {
            dy_2 -= 1;
        }
        if (keys_2['arrowdown']) {
            dy_2 += 1;
        }
        if (keys_2['arrowleft']) {
            dx_2 -= 1;
        }
        if (keys_2['arrowright']) {
            dx_2 += 1;
        }

        //AVOID PLAYER FROM GOING OFF BOUNDS
        x_2 = Math.min(x_2, window_width - 50);
        y_2 = Math.min(y_2, window_height - 50);

        x_2 = Math.max((window_width - 50)/2 + 50, x_2);
        y_2 = Math.max(0, y_2);

        // dont let diagonals go fastter
        const length_2 = Math.hypot(dx_2, dy_2);

        if (length_2 > 0) {
            dx_2 /= length_2;
            dy_2 /= length_2;
        }

        x_2 += dx_2 * speed_2;
        y_2 += dy_2 * speed_2;

        plr2.style.left = x_2 + 'px';
        plr2.style.top = y_2 + 'px';

        //moving the bullets for 2nd player
        for (let bullet of bullets_2.children) {
            let bullet_x = parseInt(bullet.style.left) - 60;
            bullet.style.left = bullet_x + "px";

            //check collision!
            let bulletRect = bullet.getBoundingClientRect();
            let plr_1_rect = plr1.getBoundingClientRect();

            if (
                bulletRect.left < plr_1_rect.right &&
                bulletRect.right > plr_1_rect.left &&
                bulletRect.top < plr_1_rect.bottom &&
                bulletRect.bottom > plr_1_rect.top
            ) {
                bullet.remove();
            }

            // bullet went off bounds
            if (bullet_x < 0) {
                bullet.remove();
            }
        }

        requestAnimationFrame(gameLoop2);
    }

    gameLoop();
    gameLoop2();
  </script>
</body>
