<body>
  <div id="player1"></div>
  <style>
    body { background: black; color: white; font-family: sans-serif; }

    #player1 {
        width : 50px;
        height: 50px;
        background: red;
        position: absolute;
    }
  </style>
  <script>
    const plr1 = document.getElementById("player1");
    let x = 100;
    let y = 100;
    const speed = 50;

    document.addEventListener("keydown", function(event) {
        if (event.key == "w") {
            y -= speed;
        }
        if (event.key == "s") {
            y += speed;
        }
        if (event.key == "a") {
            x -= speed;
        }
        if (event.key == 'd') {
            x += speed;
        }
        plr1.style.left = x + "px";
        plr1.style.top = y + "px";
    })
  </script>
</body>
